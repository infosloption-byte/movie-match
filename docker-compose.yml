version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: storyline_postgres
    environment:
      POSTGRES_DB: storyline_matcher
      POSTGRES_USER: storyline_user
      POSTGRES_PASSWORD: storyline_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyline_user -d storyline_matcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: ./storyline-matcher-api
      dockerfile: Dockerfile
    container_name: storyline_backend
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: storyline_matcher
      DB_USERNAME: storyline_user
      DB_PASSWORD: storyline_password
    volumes:
      - ./storyline-matcher-api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  # React Frontend
  frontend:
    build:
      context: ./storyline-matcher-web
      dockerfile: Dockerfile
    container_name: storyline_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./storyline-matcher-web:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
